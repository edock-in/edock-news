# Every pull request: run the tests, build the sample record, check every page.
# Nothing here can deploy, and a pull request from a fork gets no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: mkdir -p coverage && npm test
      - run: node scripts/make-sample-archive.mjs && git diff --exit-code test/fixtures/archive
      - run: npm run build:sample
      - run: node scripts/check-pages.mjs dist
